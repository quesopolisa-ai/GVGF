<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameHub — Sword Fight</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }
  #backBtn {
    position: fixed; top: 16px; left: 56px;
    background: #141414; border: 1px solid #333; color: #aaa;
    padding: 8px 16px; font-family: inherit; font-size: 12px;
    letter-spacing: 2px; cursor: pointer; z-index: 10;
    text-decoration: none;
  }
  #backBtn:hover { color: #0f0; border-color: #0f0; }
  canvas { background: #000; max-width: 100vw; max-height: 100vh; }
  #settingsToggle {
    position: fixed; top: 16px; left: 16px;
    width: 32px; height: 32px;
    background: #141414; border: 1px solid #333; color: #aaa;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 20; font-size: 16px;
    border-radius: 4px; user-select: none;
  }
  #settingsToggle:hover { color: #0f0; border-color: #0f0; }
  #settingsPanel {
    position: fixed; top: 0; left: 0;
    width: 380px; height: 100vh;
    background: #0a0a0a; border-right: 1px solid #222;
    z-index: 30; display: none; flex-direction: column;
    font-family: 'Courier New', monospace; font-size: 11px; color: #ccc;
  }
  #settingsPanel.open { display: flex; }
  #settingsHeader {
    padding: 12px 16px; background: #141414;
    border-bottom: 1px solid #222;
    display: flex; justify-content: space-between; align-items: center;
    letter-spacing: 2px; color: #0f0; font-size: 13px;
  }
  #settingsClose {
    background: transparent; border: none; color: #888;
    font-size: 22px; cursor: pointer; font-family: inherit; line-height: 1;
  }
  #settingsClose:hover { color: #f00; }
  #settingsContent { flex: 1; overflow-y: auto; padding: 12px; }
  .settings-section {
    margin-bottom: 12px;
    border: 1px solid #1c1c1c; border-radius: 4px; overflow: hidden;
  }
  .settings-section-title {
    padding: 8px 12px; background: #141414;
    border-bottom: 1px solid #1c1c1c;
    color: #0f0; letter-spacing: 2px; cursor: pointer;
    user-select: none; display: flex; justify-content: space-between;
    font-size: 11px;
  }
  .settings-section-title .arrow { color: #555; font-size: 10px; }
  .settings-section-body { padding: 8px 10px; display: block; }
  .settings-section.collapsed .settings-section-body { display: none; }
  .settings-row {
    display: grid; grid-template-columns: 1fr 80px;
    gap: 6px; align-items: center; padding: 3px 0;
  }
  .settings-row label {
    color: #888; font-size: 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .settings-row input {
    background: #000; border: 1px solid #333; color: #0f0;
    font-family: inherit; font-size: 11px;
    padding: 3px 5px; width: 100%; text-align: right;
  }
  .settings-row input:focus { outline: none; border-color: #0f0; }
  .settings-subheader {
    color: #ffaa00; font-size: 10px; letter-spacing: 1px;
    padding: 8px 0 4px; border-bottom: 1px solid #1a1a1a;
    margin-bottom: 4px; margin-top: 4px;
  }
  .settings-subheader:first-child { margin-top: 0; }
  #settingsReset {
    margin: 8px 0 20px; width: 100%; padding: 8px;
    background: #1a0808; border: 1px solid #441111;
    color: #ff5252; font-family: inherit; font-size: 11px;
    letter-spacing: 2px; cursor: pointer; border-radius: 4px;
  }
  #settingsReset:hover { background: #2a1010; border-color: #f00; color: #f00; }
  #settingsNote {
    font-size: 10px; color: #555;
    padding: 6px 0; line-height: 1.4; font-style: italic;
  }
</style>
</head>
<body>

<a id="backBtn" href="index.html">&larr; BACK</a>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<div id="settingsToggle">⚙</div>
<div id="settingsPanel">
  <div id="settingsHeader">
    <span>SETTINGS</span>
    <button id="settingsClose">×</button>
  </div>
  <div id="settingsContent"></div>
</div>

<script>
(function(){
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  var CONFIG = {
    ROUNDS_TO_WIN: 11,
    DR_CAP: 80,
    PARRY_TOUCH_RANGE: 12,
    PARRY_SPIN_MS: 2000,
    PARRY_LAND_MS: 700,
    PARRY_DISARM_MS: 500,
    PARRY_SLASH_MS: 160,
    PARRY_SLASH_COUNT: 5,
    PARRY_END_MS: 600
  };

  var GROUND = H - 60;
  var GRAV = 0.6, JUMP = -13;
  var BH = 90, BW = 22, HR = 11;

  var SLASH_ARCS = [
    {from: -100, to:  30},
    {from:   60, to: -50},
    {from:  -20, to:  20},
    {from:  -80, to:  60},
    {from:  -85, to:  85}
  ];

  var DIFFS = [
    {n:'EASY',    spd:2.7, react:400, pred:0.0,  jump:0.05, aggr:0.35, critMult:1.10},
    {n:'NORMAL',  spd:3.9, react:240, pred:0.25, jump:0.15, aggr:0.55, critMult:1.20},
    {n:'HARD',    spd:5.1, react:140, pred:0.55, jump:0.25, aggr:0.75, critMult:1.35},
    {n:'INSANE',  spd:6.3, react:80,  pred:0.80, jump:0.35, aggr:0.90, critMult:1.50},
    {n:'GODLIKE', spd:7.5, react:40,  pred:1.00, jump:0.45, aggr:1.00, critMult:2.50}
  ];

  var SWORDS = [
    {n:'DAGGER',      reach:60,  dmg:9,  cd:162, color:'#cfd8dc'},
    {n:'SHORT SWORD', reach:70,  dmg:15, cd:229, color:'#b0bec5'},
    {n:'LONGSWORD',   reach:100, dmg:18, cd:324, color:'#e0e0e0'},
    {n:'GREATSWORD',  reach:120, dmg:28, cd:448, color:'#ffd54f'},
    {n:'KATANA',      reach:95,  dmg:19, cd:248, color:'#80deea'},
    {n:'RAPIER',      reach:102, dmg:15, cd:191, color:'#f48fb1'}
  ];

  var ARMORS = [
    {n:'NONE',        hp:100, dr:0,  adodge:0.00, color:'#666'},
    {n:'LEATHER',     hp:120, dr:10, adodge:0.05, color:'#8d6e63'},
    {n:'CHAINMAIL',   hp:150, dr:15, adodge:0.10, color:'#9e9e9e'},
    {n:'PLATE',       hp:200, dr:25, adodge:0.20, color:'#cfd8dc'},
    {n:'DRAGONSCALE', hp:260, dr:35, adodge:0.40, color:'#66bb6a'}
  ];

  var EMBLEMS = [
    {n:'NONE',     desc:'No modifiers',                        hpMult:1.0, drMod:0,   dodgeMod:0.00, dmgMult:1.0, steal:0.00},
    {n:'ASSASSIN', desc:'+150% dmg, -40% HP',                  hpMult:0.6, drMod:0,   dodgeMod:0.00, dmgMult:2.5, steal:0.00},
    {n:'TANK',     desc:'+50% HP, +20% DR, -20% dmg',          hpMult:1.5, drMod:20,  dodgeMod:0.00, dmgMult:0.8, steal:0.00},
    {n:'FIGHTER',  desc:'+10% DR, +50% lifesteal, +10% dodge', hpMult:1.0, drMod:10,  dodgeMod:0.10, dmgMult:1.0, steal:0.50},
    {n:'HEALER',   desc:'+100% HP, -20% DR, +5% dodge',        hpMult:2.0, drMod:-20, dodgeMod:0.05, dmgMult:1.0, steal:0.00}
  ];

  var CARD_POOL = [
    {n:'VAMPIRIC', desc:'+10% lifesteal', color:'#ff4466', mag:0.10,
     apply:function(f, m){ f.steal = Math.min(2.0, f.steal + m); }},
    {n:'EVASIVE',  desc:'+5% dodge',      color:'#66ccff', mag:0.05,
     apply:function(f, m){ f.dodge = Math.min(0.95, f.dodge + m); }},
    {n:'BRUTAL',   desc:'+25% damage',    color:'#ff9933', mag:0.25,
     apply:function(f, m){ f.dmgBonus += m; }},
    {n:'ARMORED',  desc:'+10% DR',        color:'#66ff88', mag:10,
     apply:function(f, m){ f.dr = Math.min(CONFIG.DR_CAP, f.dr + m); }},
    {n:'VITALITY', desc:'+50% max HP',    color:'#ff66aa', mag:0.50,
     apply:function(f, m){ f.maxHp = Math.round(f.maxHp * (1 + m)); f.hp = f.maxHp; }}
  ];

  var SEL = 0, FIGHT = 1, CARD = 2, MATCH_OVER = 3, PARRY = 4;
  var st = SEL;
  var pickStage = 0;
  var selIdx = [1, 0, 0, 1, 1, 0, 0, 1];

  var STAGES = [
    {label:'GREEN SWORD',      items:SWORDS,  col:'#0f0'},
    {label:'GREEN ARMOR',      items:ARMORS,  col:'#0f0'},
    {label:'GREEN EMBLEM',     items:EMBLEMS, col:'#0f0'},
    {label:'GREEN DIFFICULTY', items:DIFFS,   col:'#0f0'},
    {label:'RED SWORD',        items:SWORDS,  col:'#f00'},
    {label:'RED ARMOR',        items:ARMORS,  col:'#f00'},
    {label:'RED EMBLEM',       items:EMBLEMS, col:'#f00'},
    {label:'RED DIFFICULTY',   items:DIFFS,   col:'#f00'}
  ];

  var f1, f2, winner = 0;
  var texts = [], sparks = [];

  var cardOptions = [];
  var cardCursor = 0;
  var cardLoser = null;
  var cardRerolled = false;

  var parryPoint = null;
  var parryWinner = 0;
  var parryAttacker = null;
  var parryLoser = null;
  var parryStart = 0;
  var parryPhase = 'spin';
  var parryPhaseStart = 0;
  var parrySlashIdx = 0;
  var parrySlashHit = [];
  var parrySlashDamages = [];
  var parrySlashActual = [];
  var parryAngleStart = 0;
  var parryAngleEnd = 0;
  var parryDisarmSword = null;
  var parryHitFlash = 0;
  var parryTotalDealt = 0;
  var parryFinalSlice = null;
  var parryWinnerScale = 0;
  var parryLandPulse = 0;

  var bladeTrail = [];
  var impactRings = [];
  var shake = 0;

  function totalReach(sw){ return 28 + sw.reach; }

  function mkFighter(x, dir, swIdx, arIdx, emIdx, dfIdx, col){
    var sw = SWORDS[swIdx];
    var ar = ARMORS[arIdx];
    var em = EMBLEMS[emIdx];
    var df = DIFFS[dfIdx];

    var maxHp = Math.round(ar.hp * em.hpMult);
    var dr = Math.max(-100, Math.min(CONFIG.DR_CAP, ar.dr + em.drMod));
    var dodge = Math.min(0.95, ar.adodge + em.dodgeMod);

    return {
      x:x, y:0, vx:0, vy:0, onGround:true, dir:dir,
      sw:sw, ar:ar, em:em, df:df, col:col,
      hp:maxHp, maxHp:maxHp,
      dr:dr, dodge:dodge,
      dmgMult: em.dmgMult,
      dmgBonus: 0,
      steal: em.steal,
      score: 0,
      cd:0, swing:0, resolved:false,
      stun:0, flash:0, lthink:0, qjump:false, qdodge:0,
      hx: x + dir*22, hy: GROUND - BH + 30,
      pHx:0, pHy:0, pTx:0, pTy:0,
      tx:0, ty:0,
      bob: Math.random() * 10,
      lean: 0,
      lungeApplied: false,
      disarmed: false
    };
  }

  function totalCritMult(f){ return f.df.critMult; }
  function totalDmgMult(f){  return f.dmgMult * (1 + f.dmgBonus); }

  function rawDamage(attacker){
    return attacker.sw.dmg * totalDmgMult(attacker) * totalCritMult(attacker);
  }

  function applyDR(raw, target){
    var drFrac = Math.max(-1, Math.min(CONFIG.DR_CAP / 100, target.dr / 100));
    return Math.max(1, Math.round(raw * (1 - drFrac)));
  }

  function initMatch(){
    f1 = mkFighter(180,  1, selIdx[0], selIdx[1], selIdx[2], selIdx[3], '#0f0');
    f2 = mkFighter(620, -1, selIdx[4], selIdx[5], selIdx[6], selIdx[7], '#f00');
    startRound();
  }

  function startRound(){
    f1.x = 180; f1.y = 0; f1.vx = 0; f1.vy = 0; f1.onGround = true; f1.dir = 1;
    f2.x = 620; f2.y = 0; f2.vx = 0; f2.vy = 0; f2.onGround = true; f2.dir = -1;

    f1.hp = f1.maxHp;
    f2.hp = f2.maxHp;

    f1.cd = 0; f1.swing = 0; f1.resolved = false; f1.stun = 0; f1.flash = 0;
    f2.cd = 0; f2.swing = 0; f2.resolved = false; f2.stun = 0; f2.flash = 0;

    f1.lthink = 0; f2.lthink = 0;
    f1.qjump = false; f1.qdodge = 0;
    f2.qjump = false; f2.qdodge = 0;

    f1.lean = 0; f2.lean = 0;
    f1.lungeApplied = false; f2.lungeApplied = false;
    f1.disarmed = false; f2.disarmed = false;

    f1.hx = f1.x + f1.dir*22; f1.hy = GROUND - BH + 30;
    f2.hx = f2.x + f2.dir*22; f2.hy = GROUND - BH + 30;
    f1.tx = f1.hx; f1.ty = f1.hy;
    f2.tx = f2.hx; f2.ty = f2.hy;
    f1.pHx = f1.hx; f1.pHy = f1.hy; f1.pTx = f1.hx; f1.pTy = f1.hy;
    f2.pHx = f2.hx; f2.pHy = f2.hy; f2.pTx = f2.hx; f2.pTy = f2.hy;

    texts = []; sparks = [];
    bladeTrail = []; impactRings = [];
    parryPoint = null;
    parryDisarmSword = null;
    parryFinalSlice = null;
    shake = 0;
    st = FIGHT;
    last = performance.now();
  }

  function spark(x, y, color, n){
    for(var i = 0; i < n; i++){
      var a = Math.random()*Math.PI*2, s = 1.5 + Math.random()*3;
      sparks.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 1, life:1, color:color});
    }
  }

  function spawnRing(x, y, maxR, color){
    impactRings.push({x:x, y:y, maxR:maxR, life:1, color:color});
  }

  function damage(attacker, target){
    var raw = rawDamage(attacker);
    var dmg = applyDR(raw, target);

    target.hp -= dmg;
    target.flash = 1;
    target.stun = Math.max(target.stun, 140);
    target.vx += (target.x < attacker.x ? -1 : 1) * 3;
    target.lean -= (target.x < attacker.x ? -0.8 : 0.8);

    texts.push({
      x: target.x,
      y: GROUND - BH - target.y - 30,
      vy: -0.9, life: 1,
      text: '-' + dmg,
      color: '#ff5252'
    });

    spark(target.x, GROUND - BH/2 - target.y, '#fff', 12);
    spawnRing(target.x, GROUND - BH/2 - target.y, 40, '#ff5252');
    shake = Math.min(8, shake + 3);

    if(attacker.steal > 0){
      var heal = Math.max(1, Math.round(dmg * attacker.steal));
      var before = attacker.hp;
      attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
      var actualHeal = attacker.hp - before;
      if(actualHeal > 0){
        texts.push({
          x: attacker.x,
          y: GROUND - BH - attacker.y - 30,
          vy: -0.9, life: 1,
          text: '+' + Math.round(actualHeal),
          color: '#66ff88'
        });
      }
    }

    if(target.hp <= 0){
      target.hp = 0;
      attacker.score++;

      if(attacker.score >= CONFIG.ROUNDS_TO_WIN){
        winner = (attacker === f1) ? 1 : 2;
        st = MATCH_OVER;
      } else {
        cardLoser = target;
        showCards();
        st = CARD;
      }
    }
  }

  function showCards(){ rollCards(); cardRerolled = false; }

  function rollCards(){
    var idx = [0, 1, 2, 3, 4];
    for(var s = idx.length - 1; s > 0; s--){
      var j = Math.floor(Math.random() * (s + 1));
      var t = idx[s]; idx[s] = idx[j]; idx[j] = t;
    }
    cardOptions = [idx[0], idx[1], idx[2]];
    cardCursor = 0;
  }

  function doReroll(){ if(cardRerolled) return; rollCards(); cardRerolled = true; }

  function applyCard(){
    var card = CARD_POOL[cardOptions[cardCursor]];
    card.apply(cardLoser, card.mag);
    cardLoser.dr = Math.max(-100, Math.min(CONFIG.DR_CAP, cardLoser.dr));
    startRound();
  }

  function dodgePop(t, srcX){
    t.vx += (t.x < srcX ? -1 : 1) * 4;
    texts.push({
      x: t.x, y: GROUND - BH - t.y - 30, vy: -0.9, life: 1,
      text: 'DODGE', color: '#66ccff'
    });
    spark(t.x, GROUND - BH/2 - t.y, '#66ccff', 10);
  }

  function shoulder(f){
    var bobY = Math.sin(f.bob) * 1.5;
    var leanX = f.lean * 3;
    return { x: f.x + f.dir*6 + leanX, y: (GROUND - f.y) - BH + 20 + bobY };
  }

  function poseHand(f, dt){
    var sh = shoulder(f);
    var tx, ty;
    if(f.swing > 0){
      var t = 1 - f.swing;
      var ang;
      if(t < 0.2){ ang = -Math.PI * 0.55; }
      else if(t < 0.65){
        var u = (t - 0.2) / 0.45;
        ang = -Math.PI * 0.55 + u * Math.PI * 0.9;
      } else { ang = Math.PI * 0.35; }
      var worldAng = (f.dir > 0) ? ang : (Math.PI - ang);
      var armLen = 26 + f.sw.reach * 0.35;
      tx = sh.x + Math.cos(worldAng) * armLen;
      ty = sh.y + Math.sin(worldAng) * armLen;
    } else {
      tx = sh.x + f.dir * 22;
      ty = sh.y - 4;
    }
    var rate = f.swing > 0 ? 0.75 : 0.3;
    f.hx += (tx - f.hx) * rate * dt;
    f.hy += (ty - f.hy) * rate * dt;
  }

  function updateTip(f){
    var sh = shoulder(f);
    var dx = f.hx - sh.x, dy = f.hy - sh.y;
    var len = Math.sqrt(dx*dx + dy*dy) || 1;
    f.tx = f.hx + (dx/len) * f.sw.reach;
    f.ty = f.hy + (dy/len) * f.sw.reach;
  }

  function segRect(x1, y1, x2, y2, rx1, ry1, rx2, ry2){
    var dx = x2 - x1, dy = y2 - y1;
    var t0 = 0, t1 = 1;
    var p = [-dx, dx, -dy, dy];
    var q = [x1 - rx1, rx2 - x1, y1 - ry1, ry2 - y1];
    for(var i = 0; i < 4; i++){
      if(p[i] === 0){ if(q[i] < 0) return false; }
      else {
        var r = q[i] / p[i];
        if(p[i] < 0){ if(r > t1) return false; if(r > t0) t0 = r; }
        else        { if(r < t0) return false; if(r < t1) t1 = r; }
      }
    }
    return true;
  }

  function segSeg(x1, y1, x2, y2, x3, y3, x4, y4){
    var d = (x2-x1)*(y4-y3) - (y2-y1)*(x4-x3);
    if(Math.abs(d) < 0.0001) return null;
    var t = ((x3-x1)*(y4-y3) - (y3-y1)*(x4-x3)) / d;
    var u = ((x3-x1)*(y2-y1) - (y3-y1)*(x2-x1)) / d;
    if(t >= 0 && t <= 1 && u >= 0 && u <= 1){
      return { x: x1 + t*(x2-x1), y: y1 + t*(y2-y1) };
    }
    return null;
  }

  function ptSegDist(px, py, x1, y1, x2, y2){
    var dx = x2 - x1, dy = y2 - y1;
    var len2 = dx*dx + dy*dy;
    if(len2 < 0.0001) return Math.hypot(px - x1, py - y1);
    var t = ((px - x1)*dx + (py - y1)*dy) / len2;
    t = Math.max(0, Math.min(1, t));
    var cx = x1 + t*dx, cy = y1 + t*dy;
    return Math.hypot(px - cx, py - cy);
  }

  function bladesTouch(aHx, aHy, aTx, aTy, bHx, bHy, bTx, bTy){
    if(segSeg(aHx, aHy, aTx, aTy, bHx, bHy, bTx, bTy)) return {x:(aTx+bTx)/2, y:(aTy+bTy)/2};
    var N = 10;
    for(var i = 0; i <= N; i++){
      var u = i / N;
      var px = aHx + (aTx - aHx) * u;
      var py = aHy + (aTy - aHy) * u;
      var d = ptSegDist(px, py, bHx, bHy, bTx, bTy);
      if(d < CONFIG.PARRY_TOUCH_RANGE) return {x: px, y: py};
    }
    for(var j = 0; j <= N; j++){
      var v = j / N;
      var qx = bHx + (bTx - bHx) * v;
      var qy = bHy + (bTy - bHy) * v;
      var d2 = ptSegDist(qx, qy, aHx, aHy, aTx, aTy);
      if(d2 < CONFIG.PARRY_TOUCH_RANGE) return {x: qx, y: qy};
    }
    return null;
  }

  function bladeHits(f, target){
    var bx1 = target.x - BW/2;
    var bx2 = target.x + BW/2;
    var by1 = GROUND - BH - target.y;
    var by2 = GROUND - target.y;
    var N = 12;
    for(var i = 0; i <= N; i++){
      var u = i / N;
      var hx = f.pHx + (f.hx - f.pHx) * u;
      var hy = f.pHy + (f.hy - f.pHy) * u;
      var tx = f.pTx + (f.tx - f.pTx) * u;
      var ty = f.pTy + (f.ty - f.pTy) * u;
      if(segRect(hx, hy, tx, ty, bx1, by1, bx2, by2)) return true;
    }
    return false;
  }

  function startSwing(f, now){
    if(f.cd > 0 || f.stun > 0 || f.swing > 0) return;
    f.swing = 1;
    f.resolved = false;
    f.cd = f.sw.cd;
    f.lungeApplied = false;
    f.vx -= f.dir * 1.8;
  }

  function startParry(now, point){
    f1.swing = 0; f2.swing = 0;
    f1.resolved = true; f2.resolved = true;
    f1.cd = Math.max(f1.cd, 500);
    f2.cd = Math.max(f2.cd, 500);
    f1.vx -= f1.dir * 3;
    f2.vx -= f2.dir * 3;

    parryPoint = point;
    parryWinner = Math.random() < 0.5 ? 1 : 2;
    parryAttacker = (parryWinner === 1) ? f1 : f2;
    parryLoser    = (parryWinner === 1) ? f2 : f1;

    parryStart = now;
    parryPhase = 'spin';
    parryPhaseStart = now;
    parrySlashIdx = 0;
    parryDisarmSword = null;
    parryHitFlash = 0;
    parryTotalDealt = 0;
    parryFinalSlice = null;
    parryWinnerScale = 0;
    parryLandPulse = 0;
    bladeTrail = [];
    impactRings = [];

    var n = CONFIG.PARRY_SLASH_COUNT;
    parrySlashHit = [];
    parrySlashActual = [];
    for(var i = 0; i < n; i++){ parrySlashHit.push(false); parrySlashActual.push(0); }

    var raw = rawDamage(parryAttacker);
    var perDmg = applyDR(raw, parryLoser);
    var finalDmg = applyDR(raw * 1.1, parryLoser);
    parrySlashDamages = [];
    for(var k = 0; k < n - 1; k++) parrySlashDamages.push(perDmg);
    parrySlashDamages.push(finalDmg);

    var slices = 8;
    var sliceW = Math.PI * 2 / slices;
    var sliceOptions = (parryWinner === 1) ? [0, 2, 4, 6] : [1, 3, 5, 7];
    var targetSlice = sliceOptions[Math.floor(Math.random() * 4)];
    var sliceCenter = targetSlice * sliceW + sliceW / 2;
    var pointerAngle = -Math.PI / 2;
    var baseAngle = pointerAngle - sliceCenter;
    parryAngleStart = 0;
    parryAngleEnd = baseAngle + 6 * Math.PI * 2;

    st = PARRY;
  }

  function easeOutQuint(t){ return 1 - Math.pow(1 - t, 5); }

  function stepParry(now){
    var elapsed = now - parryPhaseStart;
    parryHitFlash = Math.max(0, parryHitFlash - 0.06);
    parryLandPulse = Math.max(0, parryLandPulse - 0.04);
    parryWinnerScale = Math.min(1, parryWinnerScale + 0.08);

    if(parryDisarmSword){
      parryDisarmSword.x += parryDisarmSword.vx;
      parryDisarmSword.y += parryDisarmSword.vy;
      parryDisarmSword.vy += 0.55;
      parryDisarmSword.rot += parryDisarmSword.rotV;
      parryDisarmSword.vx *= 0.99;
      parryDisarmSword.life -= 0.006;
      if(parryDisarmSword.life > 0.3 && Math.random() < 0.5){
        sparks.push({
          x: parryDisarmSword.x + (Math.random()*2-1)*6,
          y: parryDisarmSword.y + (Math.random()*2-1)*6,
          vx: -parryDisarmSword.vx*0.15, vy: -parryDisarmSword.vy*0.15,
          life: 0.6, color: parryLoser.sw.color
        });
      }
    }

    if(parryFinalSlice){
      parryFinalSlice.life -= 0.016;
      if(parryFinalSlice.life <= 0) parryFinalSlice = null;
    }

    for(var i = bladeTrail.length - 1; i >= 0; i--){
      bladeTrail[i].life -= 0.045;
      if(bladeTrail[i].life <= 0) bladeTrail.splice(i, 1);
    }
    for(var j = impactRings.length - 1; j >= 0; j--){
      impactRings[j].life -= 0.03;
      if(impactRings[j].life <= 0) impactRings.splice(j, 1);
    }

    if(parryPhase === 'spin'){
      if(elapsed >= CONFIG.PARRY_SPIN_MS){
        parryPhase = 'land';
        parryPhaseStart = now;
        parryLandPulse = 1;
        shake = Math.min(6, shake + 4);
        spawnRing(W/2, H/2 + 10, 180, '#ffee55');
      }
    } else if(parryPhase === 'land'){
      if(elapsed >= CONFIG.PARRY_LAND_MS){
        parryPhase = 'disarm';
        parryPhaseStart = now;

        parryAttacker.dir = (parryAttacker.x < parryLoser.x) ? 1 : -1;
        parryAttacker.x = parryLoser.x - parryAttacker.dir * 55;
        parryAttacker.y = 0;
        parryAttacker.vx = 0; parryAttacker.vy = 0;
        parryAttacker.lean = parryAttacker.dir * 0.6;

        parryLoser.dir = -parryAttacker.dir;
        parryLoser.lean = parryAttacker.dir * -0.4;

        var awayDir = (parryLoser.x < parryAttacker.x) ? -1 : 1;
        parryDisarmSword = {
          x: parryLoser.tx,
          y: parryLoser.ty,
          vx: awayDir * 9 + (Math.random() * 2 - 1),
          vy: -7,
          rot: 0,
          rotV: awayDir * 0.45,
          color: parryLoser.sw.color,
          life: 1.6
        };

        parryLoser.disarmed = true;
        spark(parryLoser.tx, parryLoser.ty, '#ffee55', 24);
        spawnRing(parryLoser.tx, parryLoser.ty, 80, '#ffee55');
        shake = Math.min(10, shake + 6);
        texts.push({
          x: parryLoser.tx, y: parryLoser.ty - 20, vy: -0.9, life: 1.4,
          text: 'DISARM!', color: '#ffee55', big: true
        });
      }
    } else if(parryPhase === 'disarm'){
      if(elapsed >= CONFIG.PARRY_DISARM_MS){
        parryPhase = 'slash';
        parryPhaseStart = now;
        parrySlashIdx = 0;
      }
    } else if(parryPhase === 'slash'){
      if(parryAttacker){
        bladeTrail.push({x: parryAttacker.tx, y: parryAttacker.ty, life: 1});
        if(bladeTrail.length > 60) bladeTrail.shift();
      }

      var slashT = elapsed / CONFIG.PARRY_SLASH_MS;
      if(slashT >= 0.55 && !parrySlashHit[parrySlashIdx]){
        parrySlashHit[parrySlashIdx] = true;
        applySlashHit(parrySlashIdx);
      }
      if(slashT >= 1){
        parrySlashIdx++;
        parryPhaseStart = now;
        if(parrySlashIdx >= CONFIG.PARRY_SLASH_COUNT){
          parryPhase = 'done';
          parryPhaseStart = now;
        }
      }
    } else if(parryPhase === 'done'){
      if(elapsed >= CONFIG.PARRY_END_MS){
        resolveParryEnd();
      }
    }
  }

  function applySlashHit(idx){
    var isFinal = (idx === CONFIG.PARRY_SLASH_COUNT - 1);

    if(parryLoser.hp <= 0){
      parrySlashActual[idx] = 0;
      parryHitFlash = 0.5;
      return;
    }

    var hitX = parryLoser.x;
    var hitY = GROUND - BH/2 - parryLoser.y;
    var offX = (idx - (CONFIG.PARRY_SLASH_COUNT - 1)/2) * 14;

    var planned = parrySlashDamages[idx];
    var actual = Math.min(planned, parryLoser.hp);
    parryLoser.hp -= actual;
    parrySlashActual[idx] = actual;
    parryTotalDealt += actual;

    parryLoser.flash = 1;
    parryLoser.stun = 200;
    parryLoser.vx += parryAttacker.dir * 2.5;
    parryLoser.lean += parryAttacker.dir * 0.7;

    texts.push({
      x: hitX + offX,
      y: hitY - 34,
      vy: -1.0, life: 1.6,
      text: (isFinal ? 'FINAL SLASH  ' : 'SLASH ' + (idx + 1) + '  ') + '-' + actual,
      color: isFinal ? '#ff3333' : '#ffcc33',
      big: true
    });

    texts.push({
      x: hitX + offX,
      y: hitY - 14,
      vy: -0.7, life: 1.4,
      text: 'total ' + parryTotalDealt,
      color: '#ff9933'
    });

    if(isFinal){
      parryFinalSlice = {
        x: parryLoser.x,
        y: GROUND - BH/2 - parryLoser.y,
        life: 1.0,
        angle: parryAttacker.dir > 0 ? 0.12 : -0.12
      };
      spark(hitX, hitY, '#fff', 40);
      spark(hitX, hitY, '#ff3333', 30);
      spawnRing(hitX, hitY, 160, '#ff3333');
      spawnRing(hitX, hitY, 100, '#fff');
      parryHitFlash = 1.5;
      shake = Math.min(14, shake + 10);
    } else {
      spark(hitX, hitY, '#fff', 16);
      spark(hitX, hitY, '#ffee55', 10);
      spawnRing(hitX, hitY, 70, '#ffcc33');
      parryHitFlash = 1;
      shake = Math.min(10, shake + 5);
    }
  }

  function resolveParryEnd(){
    if(parryAttacker.steal > 0 && parryTotalDealt > 0){
      var heal = Math.max(1, Math.round(parryTotalDealt * parryAttacker.steal));
      parryAttacker.hp = Math.min(parryAttacker.maxHp, parryAttacker.hp + heal);
    }

    if(parryLoser.hp <= 0){
      parryLoser.hp = 0;
      parryAttacker.score++;

      if(parryAttacker.score >= CONFIG.ROUNDS_TO_WIN){
        winner = (parryAttacker === f1) ? 1 : 2;
        st = MATCH_OVER;
      } else {
        cardLoser = parryLoser;
        showCards();
        st = CARD;
      }
    } else {
      parryPoint = null;
      parryLoser.disarmed = false;
      parryLoser.cd = 400;
      parryAttacker.cd = 400;
      parryLoser.stun = 0;
      parryAttacker.stun = 0;
      st = FIGHT;
      last = performance.now();
    }
  }

  function computeSlashPose(attacker, slashIdx, t){
    var arc = SLASH_ARCS[slashIdx % SLASH_ARCS.length];
    var fromRad = arc.from * Math.PI / 180;
    var toRad   = arc.to   * Math.PI / 180;
    if(attacker.dir < 0){ fromRad = Math.PI - fromRad; toRad = Math.PI - toRad; }
    var eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
    var ang = fromRad + (toRad - fromRad) * eased;

    var sh = shoulder(attacker);
    var armLen = 26 + attacker.sw.reach * 0.35;
    var hx = sh.x + Math.cos(ang) * armLen;
    var hy = sh.y + Math.sin(ang) * armLen;
    var dx = hx - sh.x, dy = hy - sh.y;
    var dl = Math.sqrt(dx*dx + dy*dy) || 1;
    return {
      hx: hx, hy: hy,
      tx: hx + (dx/dl) * attacker.sw.reach,
      ty: hy + (dy/dl) * attacker.sw.reach
    };
  }

  function updateParryPoses(now){
    if(!parryAttacker) return;

    if(parryPhase === 'slash'){
      var slashT = Math.min(1, (now - parryPhaseStart) / CONFIG.PARRY_SLASH_MS);
      var pose = computeSlashPose(parryAttacker, parrySlashIdx, slashT);
      parryAttacker.hx = pose.hx;
      parryAttacker.hy = pose.hy;
      parryAttacker.tx = pose.tx;
      parryAttacker.ty = pose.ty;
    } else if(parryPhase === 'disarm'){
      var sh = shoulder(parryAttacker);
      var armLen = 26 + parryAttacker.sw.reach * 0.35;
      var readyAng = parryAttacker.dir > 0 ? -Math.PI * 0.8 : -Math.PI * 0.2;
      var rhx = sh.x + Math.cos(readyAng) * armLen;
      var rhy = sh.y + Math.sin(readyAng) * armLen;
      var rdx = rhx - sh.x, rdy = rhy - sh.y;
      var rdl = Math.sqrt(rdx*rdx + rdy*rdy) || 1;
      parryAttacker.hx = rhx;
      parryAttacker.hy = rhy;
      parryAttacker.tx = rhx + (rdx/rdl) * parryAttacker.sw.reach;
      parryAttacker.ty = rhy + (rdy/rdl) * parryAttacker.sw.reach;
    } else if(parryPhase === 'done'){
      var pose2 = computeSlashPose(parryAttacker, CONFIG.PARRY_SLASH_COUNT - 1, 1);
      parryAttacker.hx = pose2.hx;
      parryAttacker.hy = pose2.hy;
      parryAttacker.tx = pose2.tx;
      parryAttacker.ty = pose2.ty;
    }
  }

  function think(f, opp, now){
    var df = f.df;
    var dist = Math.abs(f.x - opp.x);
    var myReach = totalReach(f.sw);
    var predictX = opp.x + opp.vx * df.pred * 10;
    var aim = Math.abs(f.x - predictX);

    if(opp.swing > 0.3 && aim < myReach && f.cd <= 0 && f.stun <= 0){
      if(Math.random() < 0.30){
        startSwing(f, now);
        return;
      }
    }

    if(aim < myReach - 10 && f.cd <= 0 && f.stun <= 0 && Math.random() < df.aggr){
      startSwing(f, now);
      return;
    }

    if(f.onGround && Math.random() < df.jump * 0.25 && dist > myReach) f.qjump = true;

    var ideal = myReach * 0.7;
    if(dist > ideal + 20){
      f.vx += f.dir * df.spd * 0.4;
      if(Math.random() < 0.15) f.vx += f.dir * df.spd * 0.5;
    } else if(dist < ideal - 20){
      if(Math.random() > df.aggr * 0.5) f.vx -= f.dir * df.spd * 0.35;
    } else {
      if(Math.random() < 0.4){
        var hop = (Math.random() < 0.5 ? 1 : -1) * df.spd * 0.35;
        f.vx += hop;
      }
    }
  }

  function stepFighter(f, opp, now, dt){
    if(f.hp <= 0) return;
    if(now - f.lthink >= f.df.react){ think(f, opp, now); f.lthink = now; }

    f.cd = Math.max(0, f.cd - dt * 16.667);
    f.stun = Math.max(0, f.stun - dt * 16.667);
    f.flash = Math.max(0, f.flash - dt * 0.06);
    f.bob += dt * 0.18;

    var targetLean = Math.max(-1, Math.min(1, f.vx * f.dir * 0.35));
    f.lean += (targetLean - f.lean) * 0.18 * dt;

    if(f.qjump && f.onGround){ f.vy = JUMP; f.onGround = false; f.qjump = false; }
    if(f.qdodge !== 0){ f.vx += f.qdodge * f.df.spd * 1.4; f.qdodge = 0; }

    f.x += f.vx * dt;
    f.vx *= 0.85;
    f.vy += GRAV * dt;
    f.y -= f.vy * dt;

    if(f.y <= 0){ f.y = 0; f.vy = 0; f.onGround = true; }
    if(f.x < 40)   { f.x = 40; f.vx = 0; }
    if(f.x > W-40) { f.x = W-40; f.vx = 0; }

    f.pHx = f.hx; f.pHy = f.hy; f.pTx = f.tx; f.pTy = f.ty;

    if(f.swing > 0){
      var prevSwing = f.swing;
      f.swing = Math.max(0, f.swing - dt * 0.1155);

      if(!f.lungeApplied && f.swing <= 0.75){
        f.vx += f.dir * 5.5;
        f.lungeApplied = true;
      }

      poseHand(f, dt);
      updateTip(f);

      if(!f.resolved && prevSwing <= 0.9 && prevSwing >= 0.15){
        if(bladeHits(f, opp)){
          if(Math.random() < opp.dodge){ dodgePop(opp, f.x); }
          else {
            damage(f, opp);
            spark(f.tx, f.ty, f.sw.color, 14);
          }
          f.resolved = true;
          f.swing = Math.min(f.swing, 0.2);
        }
      }

      if(f.swing === 0 && prevSwing > 0){ f.vx -= f.dir * 2.2; }
    } else {
      poseHand(f, dt);
      updateTip(f);
    }
  }

  function step(now, dt){
    if(f1.swing > 0.15 && f2.swing > 0.15){
      var touch = bladesTouch(f1.hx, f1.hy, f1.tx, f1.ty, f2.hx, f2.hy, f2.tx, f2.ty);
      if(touch){
        startParry(now, touch);
        return;
      }
    }

    stepFighter(f1, f2, now, dt);
    if(st !== FIGHT) return;
    stepFighter(f2, f1, now, dt);
    if(st !== FIGHT) return;

    var gap = Math.abs(f1.x - f2.x);
    if(gap < BW + 4){
      var push = (BW + 4 - gap) / 2;
      if(f1.x < f2.x){ f1.x -= push; f2.x += push; }
      else           { f1.x += push; f2.x -= push; }
    }
    if(f1.x < f2.x){ f1.dir = 1; f2.dir = -1; }
    else           { f1.dir = -1; f2.dir = 1; }

    for(var i = texts.length - 1; i >= 0; i--){
      var t = texts[i]; t.y += t.vy*dt; t.life -= dt*0.02;
      if(t.life <= 0) texts.splice(i, 1);
    }
    for(var s = sparks.length - 1; s >= 0; s--){
      var p = sparks[s]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.25*dt; p.life -= dt*0.04;
      if(p.life <= 0) sparks.splice(s, 1);
    }
    for(var r = impactRings.length - 1; r >= 0; r--){
      impactRings[r].life -= 0.03 * dt;
      if(impactRings[r].life <= 0) impactRings.splice(r, 1);
    }
  }

  function drawFighter(f){
    var body = f.flash > 0.5 ? '#fff' : f.ar.color;
    var gy = GROUND - f.y;
    var bobY = Math.sin(f.bob) * 1.5;
    var bobX = Math.cos(f.bob * 0.7) * 1.2;
    var leanX = f.lean * 5;

    var sc = Math.max(0.3, 1 - f.y/200);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.ellipse(f.x + bobX, GROUND + 2, 18*sc, 4*sc, 0, 0, Math.PI*2); ctx.fill();

    var legSpread = Math.sin(f.bob * 1.6) * 3;
    ctx.fillStyle = body;
    ctx.fillRect(f.x - 8 + leanX * 0.5 - legSpread, gy - 20, 6, 20);
    ctx.fillRect(f.x + 2 + leanX * 0.5 + legSpread, gy - 20, 6, 20);

    ctx.fillStyle = body;
    ctx.fillRect(f.x - BW/2 + leanX + bobX, gy - BH + bobY, BW, BH - 18);

    var headX = f.x + leanX * 1.2 + bobX;
    var headY = gy - BH - HR + bobY * 0.8;
    ctx.beginPath();
    ctx.fillStyle = body;
    ctx.arc(headX, headY, HR, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = f.col;
    ctx.fillRect(headX + (f.dir > 0 ? 4 : -8), headY - 2, 4, 4);

    var sh = shoulder(f);
    var dx = f.hx - sh.x, dy = f.hy - sh.y;
    var alen = Math.sqrt(dx*dx + dy*dy);
    if(alen > 60){
      f.hx = sh.x + dx*(60/alen); f.hy = sh.y + dy*(60/alen);
      dx = f.hx - sh.x; dy = f.hy - sh.y;
    }
    var px = -dy, py = dx;
    var pl = Math.sqrt(px*px + py*py) || 1;
    var bend = f.swing > 0 ? 14 : 6;
    var sgn = f.dir > 0 ? 1 : -1;
    var ex = sh.x + dx*0.5 + (px/pl)*bend*-sgn;
    var ey = sh.y + dy*0.5 + (py/pl)*bend*-sgn;

    ctx.strokeStyle = body; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(ex, ey); ctx.lineTo(f.hx, f.hy); ctx.stroke();

    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(f.hx, f.hy, 4, 0, Math.PI*2); ctx.fill();

    if(!f.disarmed){
      ctx.strokeStyle = f.sw.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(f.hx, f.hy); ctx.lineTo(f.tx, f.ty); ctx.stroke();

      var gdx = f.tx - f.hx, gdy = f.ty - f.hy;
      var gl = Math.sqrt(gdx*gdx + gdy*gdy) || 1;
      ctx.strokeStyle = '#444'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(f.hx - (-gdy/gl*6), f.hy - (gdx/gl*6));
      ctx.lineTo(f.hx + (-gdy/gl*6), f.hy + (gdx/gl*6));
      ctx.stroke();
    }

    var w = 80, bh2 = 7;
    var bx = f.x - w/2, by = gy - BH - HR - 30;
    ctx.fillStyle = '#222'; ctx.fillRect(bx, by, w, bh2);
    ctx.fillStyle = f.col; ctx.fillRect(bx, by, w*Math.max(0, f.hp/f.maxHp), bh2);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, w, bh2);

    ctx.font = '10px monospace'; ctx.fillStyle = '#888'; ctx.textAlign = 'center';
    ctx.fillText(f.sw.n + ' / ' + f.ar.n + ' / ' + f.em.n, f.x, by - 6);
    ctx.textAlign = 'left';
  }

  function drawArena(){
    var sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#0a0a14'); sky.addColorStop(1, '#141414');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND);
    ctx.fillStyle = '#221a14'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1;
    for(var i = 100; i < W; i += 100){
      ctx.beginPath(); ctx.moveTo(i, GROUND); ctx.lineTo(i, H); ctx.stroke();
    }
  }

  function drawDisarmSword(s){
    if(!s || s.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, s.life));
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 12;
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(30, 0); ctx.stroke();
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawBladeTrail(){
    if(bladeTrail.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round';
    for(var i = 1; i < bladeTrail.length; i++){
      var a = bladeTrail[i - 1];
      var b = bladeTrail[i];
      ctx.strokeStyle = 'rgba(255,238,85,' + (b.life * 0.75) + ')';
      ctx.lineWidth = 6 * b.life + 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawImpactRings(){
    for(var i = 0; i < impactRings.length; i++){
      var r = impactRings[i];
      var t = 1 - r.life;
      var rad = r.maxR * t;
      ctx.globalAlpha = r.life * 0.85;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 4 * r.life + 1;
      ctx.beginPath();
      ctx.arc(r.x, r.y, rad, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawFinalSlice(s){
    if(!s) return;
    ctx.save();

  function drawWheel(alpha, angle){
    if(alpha <= 0) return;
    var cx = W/2, cy = H/2 + 10;
    var radius = 120;
    var slices = 8;
    var sliceAngle = Math.PI * 2 / slices;

    ctx.save();
    ctx.globalAlpha = alpha;

    var bg = ctx.createRadialGradient(cx, cy, 30, cx, cy, 400);
    bg.addColorStop(0, 'rgba(0,0,0,0.88)');
    bg.addColorStop(1, 'rgba(0,0,0,0.95)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.shadowColor = '#ffee55';
    ctx.shadowBlur = 40;

    var spinning = (parryPhase === 'spin');
    var trailCount = spinning ? 4 : 0;
    var trailStep = spinning ? 0.12 : 0;

    for(var ti = trailCount; ti >= 0; ti--){
      var a = angle - ti * trailStep;
      var aAlpha = (ti === 0) ? 1 : (1 - ti / (trailCount + 1)) * 0.35;
      ctx.save();
      ctx.globalAlpha = aAlpha * alpha;
      ctx.translate(cx, cy);
      ctx.rotate(a);
      for(var i = 0; i < slices; i++){
        var a0 = i * sliceAngle;
        var a1 = a0 + sliceAngle;
        var isGreen = (i % 2 === 0);
        var grad = ctx.createRadialGradient(0, 0, 20, 0, 0, radius);
        if(isGreen){
          grad.addColorStop(0, '#0a4a0a');
          grad.addColorStop(0.7, '#1e7d1e');
          grad.addColorStop(1, '#2ba02b');
        } else {
          grad.addColorStop(0, '#4a0a0a');
          grad.addColorStop(0.7, '#7d1e1e');
          grad.addColorStop(1, '#a02b2b');
        }
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, a0, a1);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    for(var j = 0; j < slices; j++){
      var b0 = j * sliceAngle;
      var b1 = b0 + sliceAngle;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, b0, b1);
      ctx.closePath();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,238,85,0.35)';
    ctx.lineWidth = 1;
    for(var k = 0; k < slices; k++){
      var ka = k * sliceAngle;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ka) * radius, Math.sin(ka) * radius);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    var hubGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 20);
    hubGrad.addColorStop(0, '#333');
    hubGrad.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = hubGrad;
    ctx.fill();
    ctx.strokeStyle = '#ffee55';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, radius + 6, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffee55';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, radius + 14, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,238,85,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();

    for(var m = 0; m < 32; m++){
      var ma = (m / 32) * Math.PI * 2;
      var r1 = radius + 8;
      var r2 = radius + (m % 4 === 0 ? 14 : 11);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ma) * r1, cy + Math.sin(ma) * r1);
      ctx.lineTo(cx + Math.cos(ma) * r2, cy + Math.sin(ma) * r2);
      ctx.strokeStyle = (m % 4 === 0) ? '#ffee55' : 'rgba(255,238,85,0.4)';
      ctx.lineWidth = (m % 4 === 0) ? 2 : 1;
      ctx.stroke();
    }

    if(parryLandPulse > 0){
      var pr = (1 - parryLandPulse) * 200 + radius;
      ctx.beginPath();
      ctx.arc(cx, cy, pr, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,238,85,' + parryLandPulse + ')';
      ctx.lineWidth = 4 * parryLandPulse + 1;
      ctx.stroke();
    }

    ctx.save();
    ctx.shadowColor = '#ffee55';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffee55';
    ctx.beginPath();
    ctx.moveTo(cx, cy - radius + 12);
    ctx.lineTo(cx - 20, cy - radius - 40);
    ctx.lineTo(cx + 20, cy - radius - 40);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx, cy - radius + 12);
    ctx.lineTo(cx - 8, cy - radius - 24);
    ctx.lineTo(cx + 8, cy - radius - 24);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.save();
    ctx.shadowColor = '#ffee55';
    ctx.shadowBlur = 24;
    ctx.font = 'bold 42px monospace';
    ctx.fillStyle = '#ffee55';
    ctx.fillText('PARRY', W/2, cy - radius - 60);
    ctx.restore();

    ctx.font = '12px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('BLADES CROSSED — FATE DECIDES', W/2, cy - radius - 36);

    if(parryPhase !== 'spin'){
      var winnerTxt = (parryWinner === 1) ? 'GREEN STRIKES' : 'RED STRIKES';
      var winnerCol = (parryWinner === 1) ? '#0f0' : '#f00';
      var scale = 0.7 + parryWinnerScale * 0.3;
      ctx.save();
      ctx.translate(W/2, cy + radius + 78);
      ctx.scale(scale, scale);
      ctx.shadowColor = winnerCol;
      ctx.shadowBlur = 20 * parryWinnerScale;
      ctx.font = 'bold 30px monospace';
      ctx.fillStyle = winnerCol;
      ctx.fillText(winnerTxt, 0, 0);
      ctx.restore();
    } else {
      ctx.font = '14px monospace';
      ctx.fillStyle = '#666';
      ctx.fillText('SPINNING...', W/2, cy + radius + 78);
    }

    ctx.restore();
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  function drawParryComboHUD(){
    if(!parryAttacker || !parryLoser) return;

    var total = CONFIG.PARRY_SLASH_COUNT;
    var shown = 0;
    if(parryPhase === 'slash') shown = parrySlashIdx;
    else if(parryPhase === 'done') shown = total;

    ctx.save();
    ctx.shadowColor = '#ffee55';
    ctx.shadowBlur = 12;
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px monospace';
    ctx.fillStyle = '#ffee55';
    ctx.fillText('COMBO  ' + shown + ' / ' + total, W/2, 100);
    ctx.restore();

    var markW = 34;
    var totalW = markW * total;
    var startX = W/2 - totalW/2;
    for(var i = 0; i < total; i++){
      var mx = startX + i * markW + markW/2;
      var my = 132;
      var isFinal = (i === total - 1);
      if(i < shown){
        var col = isFinal ? '#ff3333' : '#ffcc33';
        ctx.strokeStyle = col;
        ctx.lineWidth = isFinal ? 4 : 3;
        ctx.beginPath(); ctx.moveTo(mx - 11, my - 11); ctx.lineTo(mx + 11, my + 11); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(mx + 11, my - 11); ctx.lineTo(mx - 11, my + 11); ctx.stroke();
      } else {
        ctx.strokeStyle = isFinal ? '#441111' : '#333';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(mx, my, isFinal ? 11 : 9, 0, Math.PI * 2); ctx.stroke();
      }
    }

    if(parryTotalDealt > 0 || parryPhase === 'done'){
      var done = (parryPhase === 'done');
      ctx.save();
      ctx.shadowColor = done ? '#66ff88' : '#ff9933';
      ctx.shadowBlur = 14;
      ctx.font = 'bold 28px monospace';
      ctx.fillStyle = done ? '#66ff88' : '#ff9933';
      var totalStr = (done ? 'TOTAL  ' : 'DMG  ') + parryTotalDealt;
      ctx.fillText(totalStr, W/2, 178);
      ctx.restore();
    }

    var listY = 240;
    ctx.textAlign = 'left';
    ctx.font = '12px monospace';
    var listX = parryLoser.x < W/2 ? W/2 - 300 : W/2 + 220;
    ctx.fillStyle = '#888';
    ctx.fillText('SLASH LOG', listX, listY - 14);
    for(var j = 0; j < total; j++){
      var rowY = listY + j * 18;
      var isFin = (j === total - 1);
      if(parrySlashHit[j]){
        var d = parrySlashActual[j] || 0;
        ctx.fillStyle = isFin ? '#ff3333' : '#ffcc33';
        var label = isFin ? ('FINAL   -' + d) : ('SLASH ' + (j + 1) + '   -' + d);
        ctx.fillText(label, listX, rowY);
      } else if(j === parrySlashIdx && parryPhase === 'slash'){
        ctx.fillStyle = '#666';
        ctx.fillText('SLASH ' + (j + 1) + '   ...', listX, rowY);
      } else {
        ctx.fillStyle = '#333';
        ctx.fillText('SLASH ' + (j + 1) + '   --', listX, rowY);
      }
    }

    ctx.textAlign = 'left';
  }

  function currentUpgradeValue(f, name){
    if(name === 'VAMPIRIC') return Math.round(f.steal * 100) + '%';
    if(name === 'EVASIVE')  return Math.round(f.dodge * 100) + '%';
    if(name === 'BRUTAL')   return '+' + Math.round(f.dmgBonus * 100) + '%';
    if(name === 'ARMORED')  return f.dr + '%';
    if(name === 'VITALITY') return 'HP ' + Math.round(f.maxHp);
    return '--';
  }

      summary.push('R: ' + SWORDS[selIdx[4]].n + ' / ' + ARMORS[selIdx[5]].n + ' / ' + EMBLEMS[selIdx[6]].n + ' / ' + DIFFS[selIdx[7]].n);
    }

  function key(e){
    var k = e.key;
    if(k === 'Escape' || k === 'Esc'){ window.location.href = 'index.html'; return; }

    if(st === SEL){
      var stage = STAGES[pickStage];
      if(k === 'ArrowUp' || k === 'ArrowDown'){
        var c = selIdx[pickStage];
        c += (k === 'ArrowUp' ? -1 : 1);
        if(c < 0) c = stage.items.length - 1;
        if(c >= stage.items.length) c = 0;
        selIdx[pickStage] = c;
        e.preventDefault();
      } else if(k === 'Enter'){
        pickStage++;
        if(pickStage >= 8){ initMatch(); pickStage = 0; }
        e.preventDefault();
      }
      return;
    }

    if(st === CARD){
      if(k === 'ArrowLeft'){ cardCursor = (cardCursor + 2) % 3; e.preventDefault(); }
      else if(k === 'ArrowRight'){ cardCursor = (cardCursor + 1) % 3; e.preventDefault(); }
      else if(k === 'r' || k === 'R'){ doReroll(); e.preventDefault(); }
      else if(k === 'Enter' || k === ' '){ applyCard(); e.preventDefault(); }
      return;
    }

    if(st === MATCH_OVER){
      if(k === ' ' || k === 'Spacebar'){ initMatch(); e.preventDefault(); }
      else if(k === 'c' || k === 'C'){ st = SEL; pickStage = 0; e.preventDefault(); }
    }
  }

    for(var i = 0; i < EMBLEMS.length; i++){
      var em = EMBLEMS[i];
      emHtml += '<div class="settings-subheader">' + em.n + '</div>';
      emHtml += rowInput('emblem:' + i + ':hpMult', 'HP multiplier', em.hpMult, 0.1, 5, 0.05);
      emHtml += rowInput('emblem:' + i + ':drMod', 'DR modifier', em.drMod, -50, 50, 5);
      emHtml += rowInput('emblem:' + i + ':dodgeMod', 'Dodge add', em.dodgeMod, 0, 0.9, 0.05);
      emHtml += rowInput('emblem:' + i + ':dmgMult', 'Damage multiplier', em.dmgMult, 0.1, 5, 0.05);
      emHtml += rowInput('emblem:' + i + ':steal', 'Lifesteal', em.steal, 0, 2, 0.05);
    }
    html += section('EMBLEMS', emHtml);

    var dHtml = '';
    for(var i = 0; i < DIFFS.length; i++){
      var d = DIFFS[i];
      dHtml += '<div class="settings-subheader">' + d.n + '</div>';
      dHtml += rowInput('diff:' + i + ':spd', 'Move speed', d.spd, 0, 20, 0.1);
      dHtml += rowInput('diff:' + i + ':react', 'Reaction ms', d.react, 0, 2000, 10);
      dHtml += rowInput('diff:' + i + ':pred', 'Prediction', d.pred, 0, 1, 0.05);
      dHtml += rowInput('diff:' + i + ':jump', 'Jump chance', d.jump, 0, 1, 0.05);
      dHtml += rowInput('diff:' + i + ':aggr', 'Aggression', d.aggr, 0, 1, 0.05);
      dHtml += rowInput('diff:' + i + ':critMult', 'Crit multiplier', d.critMult, 1, 10, 0.05);
    }
    html += section('DIFFICULTY', dHtml);

    var cHtml = '';
    for(var i = 0; i < CARD_POOL.length; i++){
      var c = CARD_POOL[i];
      cHtml += '<div class="settings-subheader">' + c.n + '</div>';
      cHtml += rowInput('card:' + i + ':mag', 'Magnitude', c.mag, 0, 10, 0.01);
    }
    html += section('CARDS', cHtml);

    var mHtml = '';
    mHtml += rowInput('config:ROUNDS_TO_WIN', 'Rounds to win', CONFIG.ROUNDS_TO_WIN, 1, 99, 1);
    mHtml += rowInput('config:DR_CAP', 'DR cap %', CONFIG.DR_CAP, 0, 100, 5);
    html += section('MATCH', mHtml);

    var pHtml = '';
    pHtml += rowInput('config:PARRY_TOUCH_RANGE', 'Touch range', CONFIG.PARRY_TOUCH_RANGE, 0, 100, 2);
    pHtml += rowInput('config:PARRY_SPIN_MS', 'Spin ms', CONFIG.PARRY_SPIN_MS, 100, 8000, 100);
    pHtml += rowInput('config:PARRY_LAND_MS', 'Land ms', CONFIG.PARRY_LAND_MS, 100, 3000, 50);
    pHtml += rowInput('config:PARRY_DISARM_MS', 'Disarm ms', CONFIG.PARRY_DISARM_MS, 100, 2000, 50);
    pHtml += rowInput('config:PARRY_SLASH_MS', 'Slash ms', CONFIG.PARRY_SLASH_MS, 30, 1000, 10);
    pHtml += rowInput('config:PARRY_SLASH_COUNT', 'Slash count', CONFIG.PARRY_SLASH_COUNT, 1, 20, 1);
    pHtml += rowInput('config:PARRY_END_MS', 'End ms', CONFIG.PARRY_END_MS, 100, 3000, 100);
    html += section('PARRY', pHtml);

    html += '<div id="settingsNote">Armor / Emblem / Card changes take effect next round. Sword, Difficulty, Match, and Parry changes are instant.</div>';
    html += '<button id="settingsReset">RESET ALL (reload)</button>';

    el.innerHTML = html;

    var titles = el.querySelectorAll('.settings-section-title');
    for(var t = 0; t < titles.length; t++){
      titles[t].addEventListener('click', function(){
        this.parentNode.classList.toggle('collapsed');
      });
    }
    var inputs = el.querySelectorAll('input[data-key]');
    for(var k = 0; k < inputs.length; k++){
      inputs[k].addEventListener('change', onSettingChange);
    }
    document.getElementById('settingsReset').addEventListener('click', function(){
      location.reload();
    });
  }

  function onSettingChange(e){
    var key = e.target.getAttribute('data-key');
    var val = parseFloat(e.target.value);
    if(isNaN(val)) return;
    var parts = key.split(':');
    var obj = null;

    if(parts[0] === 'sword') obj = SWORDS[parseInt(parts[1])];
    else if(parts[0] === 'armor') obj = ARMORS[parseInt(parts[1])];
    else if(parts[0] === 'emblem') obj = EMBLEMS[parseInt(parts[1])];
    else if(parts[0] === 'diff') obj = DIFFS[parseInt(parts[1])];
    else if(parts[0] === 'card') obj = CARD_POOL[parseInt(parts[1])];
    else if(parts[0] === 'config'){
      CONFIG[parts[1]] = val;
      return;
    }
    if(obj) obj[parts[2]] = val;
  }

  (function initSettings(){
    var toggle = document.getElementById('settingsToggle');
    var panel = document.getElementById('settingsPanel');
    var closeBtn = document.getElementById('settingsClose');
    toggle.addEventListener('click', function(){ panel.classList.toggle('open'); });
    closeBtn.addEventListener('click', function(){ panel.classList.remove('open'); });
    buildSettingsContent();
  })();

  var raf = null, last = 0;

  function loop(now){
    var dt = (now - last) / 16.667;
    if(dt > 1.5) dt = 1.5;
    if(dt < 0.1) dt = 0.1;
    last = now;

    if(st === SEL){
      drawSelect();
    } else {
      if(st === FIGHT) step(now, dt);
      if(st === PARRY){
        stepParry(now);
        updateParryPoses(now);
      }
      drawFight();

      if(st === PARRY){
        var wheelAlpha = 1;
        var wheelAngle = 0;
        var elapsed = now - parryPhaseStart;

        if(parryPhase === 'spin'){
          var t = Math.min(1, elapsed / CONFIG.PARRY_SPIN_MS);
          var eased = easeOutQuint(t);
          wheelAngle = parryAngleStart + (parryAngleEnd - parryAngleStart) * eased;
        } else {
          wheelAngle = parryAngleEnd;
          if(parryPhase === 'land') wheelAlpha = 1;
          else if(parryPhase === 'disarm') wheelAlpha = Math.max(0, 1 - elapsed / CONFIG.PARRY_DISARM_MS);
          else wheelAlpha = 0;
        }

        if(wheelAlpha > 0){
          drawWheel(wheelAlpha, wheelAngle);
        } else {
          var dim = (parryPhase === 'slash' || parryPhase === 'done') ? 0.35 : 0;
          if(dim > 0){
            ctx.fillStyle = 'rgba(0,0,0,' + dim + ')';
            ctx.fillRect(0, 0, W, H);
          }
        }

        if(parryPhase === 'slash' || parryPhase === 'done'){
          drawParryComboHUD();
        }
      }

      if(st === CARD) drawCardOverlay();
      if(st === MATCH_OVER) drawMatchOverOverlay();
    }

    if(shake > 0.15){
      canvas.style.transform = 'translate(' +
        ((Math.random()*2-1)*shake).toFixed(1) + 'px,' +
        ((Math.random()*2-1)*shake).toFixed(1) + 'px)';
    } else if(canvas.style.transform){
      canvas.style.transform = '';
    }
    shake *= 0.82;

    raf = requestAnimationFrame(loop);
  }

  st = SEL; pickStage = 0;
  selIdx = [1, 0, 0, 1, 1, 0, 0, 1];
  winner = 0;
  texts = []; sparks = [];
  document.addEventListener('keydown', key, true);
  last = performance.now();
  raf = requestAnimationFrame(loop);
})();
</script>

</body>
</html>
